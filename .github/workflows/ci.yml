name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# New pushes replace pull-request runs; on main every run finishes, so a deploy is never cut short.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint (errors only; line length is not enforced yet)
        run: ruff check . --select F,E9
      - run: pytest -q
      - name: Environment check (no database in CI)
        env:
          DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/ci
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ci-only-secret-that-is-long-enough-1234567890
        run: python scripts/verify_environment.py --skip-network

  deploy-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck deploy/ec2/*.sh
      - name: Production compose file is valid
        working-directory: deploy/ec2
        env:
          TRADZLOG_DOMAIN: tradzlog.example
          POSTGRES_PASSWORD: ci_password_1234567890
          JWT_SECRET: ci-only-secret-that-is-long-enough-1234567890
          S3_BUCKET: ci-bucket
        run: docker compose config --quiet

  # Multi-arch image: arm64 for the Graviton EC2 instance, amd64 for everything else.
  image:
    needs: [test, deploy-config]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/tradzlog:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/tradzlog:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Production deploy to the EC2 instance shared with Mizan, only after every check passed. Turned
  # on by the repository variable EC2_DEPLOY=true once the server is set up (docs/DEPLOY_AWS.md).
  # Settings come from AWS Parameter Store (/tradzlog/*) on the server; GitHub only holds how to
  # reach it. If the new version does not become healthy, the previous one is started again.
  deploy:
    needs: image
    if: vars.EC2_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
    steps:
      - uses: actions/checkout@v7
      - name: SSH key and known host
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          for name in EC2_HOST EC2_SSH_KEY EC2_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then echo "::error::$name is not set (docs/DEPLOY_AWS.md)"; exit 1; fi
          done
          install -d -m 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Copy the server configuration
        run: |
          scp deploy/ec2/compose.yml deploy/ec2/config.sh deploy/ec2/tradzlog.caddy.template deploy/ec2/render-caddy.py \
            "deploy@$EC2_HOST:/srv/tradzlog/"
      - name: Start the new version
        env:
          TAG: ${{ github.sha }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh "deploy@$EC2_HOST" TAG="$TAG" REGISTRY_USER="$REGISTRY_USER" REGISTRY_TOKEN="$REGISTRY_TOKEN" bash -s <<'EOF'
          set -euo pipefail
          cd /srv/tradzlog
          # Settings from AWS Parameter Store; stops here if one is missing or unsafe.
          bash ./config.sh
          # Check the Caddy site renders (domain and basic-auth gate) before changing anything.
          python3 render-caddy.py tradzlog.caddy.template .env /tmp/tradzlog.caddy.check
          previous="$(sed -n 's/^TRADZLOG_TAG=//p' .env | tr -d "'\"")"
          sed -i "s/^TRADZLOG_TAG=.*/TRADZLOG_TAG='$TAG'/" .env
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin >/dev/null
          if ! docker compose pull --quiet migrate api web worker; then
            docker logout ghcr.io >/dev/null
            sed -i "s/^TRADZLOG_TAG=.*/TRADZLOG_TAG='$previous'/" .env
            exit 1
          fi
          docker compose pull --quiet postgres redis
          docker logout ghcr.io >/dev/null
          # Database migrations run first (the migrate service); app containers wait for them.
          if ! docker compose up -d --wait --wait-timeout 180 --remove-orphans; then
            echo "New version unhealthy; going back to $previous" >&2
            docker compose logs --tail 50 migrate api web >&2 || true
            sed -i "s/^TRADZLOG_TAG=.*/TRADZLOG_TAG='$previous'/" .env
            docker compose up -d --wait --wait-timeout 180
            exit 1
          fi
          # Publish the site through Mizan's Caddy; a reload that fails keeps the previous config.
          python3 render-caddy.py tradzlog.caddy.template .env /srv/mizan/sites.d/tradzlog.caddy
          docker compose --project-directory /srv/mizan exec -T caddy caddy reload --config /etc/caddy/Caddyfile
          docker image prune -f >/dev/null
          echo "Running $TAG"
          EOF
      - name: Check the live app
        run: |
          ssh "deploy@$EC2_HOST" "cd /srv/tradzlog && docker compose exec -T api curl -fsS http://localhost:8000/readyz"
          domain="$(ssh "deploy@$EC2_HOST" "sed -n 's/^TRADZLOG_DOMAIN=//p' /srv/tradzlog/.env" | tr -d "'\"")"
          # 401 = HTTPS works and the private-beta gate is up; 200 = public.
          code="$(curl -sS -o /dev/null -w '%{http_code}' "https://$domain/")"
          echo "https://$domain/ answered $code"
          [ "$code" = 401 ] || [ "$code" = 200 ]
