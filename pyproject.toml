[project]
name = "tradzlog"
version = "0.1.0"
description = "Professional trades journaling and analytics platform built with Python"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7",
  "bcrypt<5",
  "python-multipart>=0.0.9",
  "email-validator>=2.1",
  "redis>=5.0",
  "rq>=1.16",
  "anthropic>=1.12,<2",
  "boto3>=1.34",
  "sentry-sdk>=2.0",
  "orjson>=3.10",
  "faker>=25.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.5",
  "mypy>=1.10",
  "pytest>=8.2",
  "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["apps/api", "apps/web", "packages/db", "packages/types"]
include = ["tradzlog_api*", "tradzlog_web*", "tradzlog_db*", "tradzlog_types*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["apps/api", "apps/web", "packages/db", "packages/types", "prisma"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
pythonpath = [".", "apps/api", "packages/db", "packages/types"]
testpaths = ["tests"]
